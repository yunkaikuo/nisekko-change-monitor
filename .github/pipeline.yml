name: pipeline

on:
  schedule:
    - cron: "0 0 1 * *"        # 1st of each month (UTC)
  workflow_dispatch:
    inputs:
      base_year:
        description: "base year"
        default: "2022"
      current_year:
        description: "reporting year"
        default: "2026"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/pipeline.py --base ${{ inputs.base_year || '2022' }} --current ${{ inputs.current_year || '2026' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
