name: pipeline

on:
  schedule:
    - cron: "0 0 1 * *"   # 1st of each month (UTC)
  workflow_dispatch:
    inputs:
      base_year:
        description: "base year"
        default: "2022"
      current_year:
        description: "reporting year"
        default: "2026"
      force:
        description: "Force rebuild"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE: ${{ inputs.base_year || '2022' }}
  CURRENT: ${{ inputs.current_year || '2026' }}
  SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.chk.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pystac-client
      - name: Get the previous manifest
        run: mkdir -p prev && (curl -fsS "$SITE/data/manifest.json" -o prev/manifest.json || echo "No previous manifest")
      - id: chk
        run: python src/check_new.py --base $BASE --current $CURRENT --prev prev/manifest.json ${{ inputs.force && '--force' || '' }}

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Get the previous metrics and history
        run: |
          mkdir -p prev
          curl -fsS "$SITE/data/metrics.json" -o prev/metrics.json || echo "No previous metrics"
          curl -fsS "$SITE/data/history.json" -o prev/history.json || echo "No previous history"
      - run: python src/pipeline.py --base $BASE --current $CURRENT
      - run: python src/monitor.py
      - name: Archive this execution log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FP=$(python -c "import json;print(json.load(open('web/data/manifest.json'))['fingerprint'])")
          gh release create "run-${{ github.run_id }}" \
            web/data/manifest.json web/data/metrics.json web/data/changes.geojson \
            --title "run ${{ github.run_id }}" --notes "fingerprint: $FP" --prerelease
      - name: Open issue when there are alerts
        if: hashFiles('alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Warning $(date -u +%F)" --body-file alerts.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
